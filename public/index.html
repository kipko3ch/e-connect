<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#edebeF" />
    <title>E-connect · Network workspace</title>
    <link rel="stylesheet" href="/style.css?v=e-connect-1" />
  </head>
  <body>
    <div class="workspace">
      <aside>
        <a href="#overview" class="logo" aria-label="E-connect home"
          ><svg viewBox="0 0 32 32" fill="none">
            <path d="M23 8H9v16h14" stroke="currentColor" stroke-width="2" />
            <path d="M9 16h11" stroke="currentColor" stroke-width="2" /></svg
        ></a>
        <nav id="nav"></nav>
        <div class="rail-bottom">
          <button
            data-page="settings"
            aria-label="Settings"
            title="Settings"
            id="rail-settings"
          ></button
          ><button
            id="logout"
            aria-label="Disconnect router"
            title="Disconnect router"
          ></button>
        </div>
      </aside>
      <main>
        <header>
          <div>
            <p class="kicker">E-CONNECT / WORKSPACE</p>
            <h1 id="page-title">Dashboard</h1>
          </div>
          <label class="search"
            ><span id="search-icon"></span
            ><input
              id="search"
              type="search"
              placeholder="Find a connected device…"
              aria-label="Search connected devices"
          /></label>
          <div class="header-actions">
            <span id="connection" class="connection">Not connected</span
            ><button
              class="icon-button"
              id="refresh"
              title="Refresh live data"
              aria-label="Refresh live data"
            ></button>
            <div class="avatar" title="Local admin">EC</div>
          </div>
        </header>
        <div id="banner"></div>
        <div id="view" class="view"></div>
        <footer>
          <span
            ><b>E-connect</b> <span class="footer-dot">●</span> Built for your
            network.</span
          ><span id="last-updated">Local router management</span>
        </footer>
      </main>
    </div>
    <dialog id="modal">
      <form id="modal-form">
        <div class="modal-heading">
          <div>
            <p class="kicker" id="modal-kicker">YOUR NETWORK</p>
            <h2 id="modal-title"></h2>
          </div>
          <button
            type="button"
            class="icon-button"
            id="close-modal"
            aria-label="Close dialog"
          >
            ×
          </button>
        </div>
        <div id="modal-content"></div>
        <p id="modal-error" role="alert" class="form-error"></p>
        <div id="modal-actions" class="modal-actions">
          <button type="button" class="button subtle" id="cancel-modal">
            Cancel</button
          ><button class="button dark" id="modal-submit">Save</button>
        </div>
      </form>
    </dialog>
    <div id="toast" role="status"></div>
    <script src="/app.js?v=e-connect-1"></script>
  </body>
</html>
